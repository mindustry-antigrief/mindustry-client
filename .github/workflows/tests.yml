name: Java Tests # Tests and pushes to unstable

on:
  push:
    branches: "**" # Runs on all branches but never on tags
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: 20
          distribution: temurin

      - name: Setup Gradle Caching
        uses: gradle/actions/setup-gradle@v4

      - name: Set Env
        run: echo "SLUG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Timestamp
        id: time
        uses: 1466587594/get-current-time@v2
        with:
          format: "[${{env.SLUG}}], MMM. D, YYYY"
          #format: "[${{env.SLUG}}], MMM. D, YYYY [Unstable]" # Pulls the tag name and current date to produce clientVersion > v1.0.0, Jan. 1, 1970

      - name: Run Tests
        run: ./gradlew tests:cleanTest tools:pack tests:test desktop:dist -PupdateUrl=JasonP01/foos -PassetUrl=JasonP01/foos -PassetRef=${{ env.SLUG }} -PclientVersion="${{ steps.time.outputs.formattedTime }}" --parallel

      - name: Create Release
        if: ${{ github.repository == 'JasonP01/foos' && github.ref == 'refs/heads/v8' }}
        id: create_release_v8
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            Foo's Client Unstable ${{ github.run_number }} [(${{ env.SLUG }})](https://github.com/JasonP01/foos/commit/${{ github.sha }})
            Steam installation instructions [here](../../../mindustry-client/tree/v8#steam)
            **Commit Message:**
            *${{ github.event.head_commit.message }}*
          commitish: v8
          tag_name: ${{ github.run_number }}
          release_name: ${{ steps.time.outputs.formattedTime }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        if: ${{ github.repository == 'JasonP01/foos' && github.ref == 'refs/heads/v8' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release_v8.outputs.upload_url }}
          asset_path: desktop/build/libs/Mindustry.jar
          asset_name: desktop.jar
          asset_content_type: application/zip

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Add Audio To Jar
        if: ${{ github.repository == 'JasonP01/foos' && github.ref == 'refs/heads/v8' }}
        run: jar uf desktop/build/libs/Mindustry.jar -C core/assets sounds -C core/assets music

      - name: Upload Release Asset With Audio
        if: ${{ github.repository == 'JasonP01/foos' && github.ref == 'refs/heads/v8' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release_v8.outputs.upload_url }}
          asset_path: desktop/build/libs/Mindustry.jar
          asset_name: desktopWithAudio.jar
          asset_content_type: application/zip

      - name: Upload Artifact (No release was made)
        if: ${{ github.repository == 'JasonP01/foos' && github.ref == 'refs/heads/v8' }}
        uses: actions/upload-artifact@v4
        with:
          name: Desktop JAR (zipped)
          path: desktop/build/libs/Mindustry.jar
